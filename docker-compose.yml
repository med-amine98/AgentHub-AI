version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agenthub-db
    restart: always
    environment:
      MYSQL_DATABASE: agenthub
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: agenthub_user
      MYSQL_PASSWORD: agenthub_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    container_name: agenthub-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://agenthub_user:agenthub_password@db:3306/agenthub
      - JWT_SECRET=supersecretjwtkeyforagenthubai2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: agenthub-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
